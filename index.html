:root{--u:2px;--gold:#ffe680;--gold2:#c8a86a;--ink:#150c26;--panel:#0e0a24;--panel2:#241a52;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Galmuri,'Malgun Gothic',sans-serif;color:#fff;touch-action:none;overscroll-behavior:none}
#wrap{position:fixed;inset:0;display:grid;place-items:center}
#stage{position:relative;width:960px;height:540px;background:#000;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:auto}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center}
.ov.show{display:flex}
.btn{font-family:inherit;font-weight:700;font-size:calc(var(--u)*11);color:#fff;background:linear-gradient(#3a2a7a,#241a52);border:calc(var(--u)*1.5) solid var(--gold2);border-radius:calc(var(--u)*3);padding:calc(var(--u)*6) calc(var(--u)*16);margin:calc(var(--u)*3);min-width:calc(var(--u)*130);cursor:pointer;box-shadow:0 calc(var(--u)*2) 0 #0a0620,inset 0 calc(var(--u)*1) 0 rgba(255,255,255,.25);text-shadow:0 calc(var(--u)*1) 0 #150c26}
.btn:hover,.btn:focus-visible{background:linear-gradient(#5a44b0,#3a2a7a);outline:none}
.btn:active{transform:translateY(calc(var(--u)*1.5));box-shadow:0 calc(var(--u)*.5) 0 #0a0620}
.btn.main{background:linear-gradient(#f5b833,#c8801a);border-color:#fff2b0;color:#3a1a00;text-shadow:0 calc(var(--u)*1) 0 rgba(255,255,255,.4);font-size:calc(var(--u)*13)}
.btn.main:hover{background:linear-gradient(#ffd25a,#e09a2a)}
.btn.small{font-size:calc(var(--u)*9);padding:calc(var(--u)*4) calc(var(--u)*10);min-width:0}
#loading{position:absolute;inset:0;background:#0a0620;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*12);color:var(--gold);z-index:50}
#loading.hide{display:none}

#title{background:linear-gradient(rgba(6,3,20,.55),rgba(6,3,20,.05) 45%,rgba(6,3,20,.6));justify-content:flex-start;padding-top:calc(var(--u)*22)}
#title .logo{font-size:calc(var(--u)*46);font-weight:700;color:var(--gold);letter-spacing:calc(var(--u)*4);line-height:1;text-shadow:calc(var(--u)*-1) 0 0 #fff8d0,0 calc(var(--u)*3) 0 #b8701a,0 calc(var(--u)*6) 0 #5a2a08,0 calc(var(--u)*9) 0 #1a0a04,0 0 calc(var(--u)*14) rgba(255,220,100,.6)}
#title .sub{font-size:calc(var(--u)*12);color:#dfe8ff;letter-spacing:calc(var(--u)*5);margin-top:calc(var(--u)*14);text-shadow:0 calc(var(--u)*1.5) 0 #150c26,0 0 calc(var(--u)*6) #150c26}
#title .menu{position:absolute;left:0;right:0;bottom:calc(var(--u)*20);display:flex;flex-direction:column;align-items:center}
#title .diff{display:flex;align-items:center;gap:calc(var(--u)*4);margin:calc(var(--u)*4) 0 calc(var(--u)*2)}
#title .diff span{font-size:calc(var(--u)*9);color:#dfe8ff;margin-right:calc(var(--u)*2);text-shadow:0 calc(var(--u)*1) 0 #150c26}
.dbtn{font-family:inherit;font-weight:700;font-size:calc(var(--u)*9);color:#c9d3ff;background:rgba(20,14,50,.85);border:calc(var(--u)*1.5) solid #4a3a8a;border-radius:calc(var(--u)*3);padding:calc(var(--u)*3) calc(var(--u)*10);cursor:pointer}
.dbtn.sel{color:#3a1a00;background:linear-gradient(#f5b833,#c8801a);border-color:#fff2b0}
#title .hint{position:absolute;left:0;right:0;bottom:calc(var(--u)*6);font-size:calc(var(--u)*7.5);color:#c9d3ff;text-shadow:0 calc(var(--u)*1) 0 #150c26}
#title .star{position:absolute;color:var(--gold);font-size:calc(var(--u)*10)}

#dlg{display:none;position:absolute;left:calc(var(--u)*8);right:calc(var(--u)*8);bottom:calc(var(--u)*8);height:calc(var(--u)*72);background:rgba(14,10,36,.94);border:calc(var(--u)*2) solid var(--gold2);border-radius:calc(var(--u)*4);box-shadow:0 0 0 calc(var(--u)*1) #150c26,0 calc(var(--u)*3) calc(var(--u)*8) rgba(0,0,0,.6);padding:calc(var(--u)*8) calc(var(--u)*10);gap:calc(var(--u)*10);align-items:flex-start;z-index:8;cursor:pointer}
#dlg.show{display:flex}
#dlg-por{width:calc(var(--u)*52);height:calc(var(--u)*52);flex:none;background:linear-gradient(#3a2a7a,#1a1240);border:calc(var(--u)*1.5) solid var(--gold2);border-radius:calc(var(--u)*3);image-rendering:pixelated}
#dlg-body{flex:1;min-width:0}
#dlg-name{display:inline-block;font-weight:700;font-size:calc(var(--u)*10);color:#150c26;background:var(--gold);padding:calc(var(--u)*1) calc(var(--u)*7);border-radius:calc(var(--u)*2);margin-bottom:calc(var(--u)*5)}
#dlg-name[data-who="류"]{background:#8ee060}#dlg-name[data-who="루미"]{background:#8adfff}#dlg-name[data-who="내레이션"]{background:#dcd0ff}
#dlg-text{font-size:calc(var(--u)*11);line-height:1.5;color:#fff;word-break:keep-all;min-height:calc(var(--u)*33)}
#dlg-next{position:absolute;right:calc(var(--u)*10);bottom:calc(var(--u)*5);color:var(--gold);font-size:calc(var(--u)*10);animation:bl .8s steps(2) infinite}
@keyframes bl{50%{opacity:0}}

#taunt{display:none;position:absolute;left:50%;top:calc(var(--u)*50);transform:translateX(-50%);min-width:calc(var(--u)*230);max-width:calc(var(--u)*330);background:rgba(50,6,20,.92);border:calc(var(--u)*2) solid #ff6a6a;border-radius:calc(var(--u)*4);padding:calc(var(--u)*7) calc(var(--u)*12);z-index:7;text-align:center;pointer-events:none}
#taunt.show{display:block;animation:pop .35s ease-out}
#taunt-name{font-weight:700;color:#ffb0b0;font-size:calc(var(--u)*10);margin-bottom:calc(var(--u)*3)}
#taunt-text{font-size:calc(var(--u)*11);line-height:1.4;word-break:keep-all}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}

#card{display:none;background:rgba(6,3,20,.82);z-index:9}
#card.show{display:flex;animation:fadein .4s}
#card-no{font-size:calc(var(--u)*13);letter-spacing:calc(var(--u)*6);color:var(--gold2)}
#card-name{font-size:calc(var(--u)*30);font-weight:700;color:var(--gold);margin:calc(var(--u)*6) 0;text-shadow:0 calc(var(--u)*3) 0 #5a2a08,0 calc(var(--u)*6) 0 #1a0a04}
#card-sub{font-size:calc(var(--u)*12);color:#dfe8ff;letter-spacing:calc(var(--u)*3)}
@keyframes fadein{from{opacity:0}}

.panel{background:linear-gradient(rgba(20,14,50,.96),rgba(10,6,30,.96));border:calc(var(--u)*2) solid var(--gold2);border-radius:calc(var(--u)*5);box-shadow:0 0 0 calc(var(--u)*1) #150c26,0 calc(var(--u)*6) calc(var(--u)*16) rgba(0,0,0,.7);padding:calc(var(--u)*12) calc(var(--u)*22);min-width:calc(var(--u)*230)}
#ov-over{background:rgba(30,0,10,.72);z-index:9}
#ov-over h1{margin:0 0 calc(var(--u)*4);font-size:calc(var(--u)*34);letter-spacing:calc(var(--u)*3);color:#ff5a5a;text-shadow:0 calc(var(--u)*3) 0 #5a0a14,0 calc(var(--u)*6) 0 #1a0408}
#over-info{font-size:calc(var(--u)*9);color:#ffc0c0;margin-bottom:calc(var(--u)*10)}
#ov-clear,#ov-end,#ov-pause{background:rgba(6,3,20,.72);z-index:9}
#ov-clear h1,#ov-end h1{margin:0;font-size:calc(var(--u)*28);color:var(--gold);letter-spacing:calc(var(--u)*2);text-shadow:0 calc(var(--u)*3) 0 #5a2a08,0 calc(var(--u)*6) 0 #1a0a04}
#clear-name{font-size:calc(var(--u)*11);color:#dfe8ff;margin:calc(var(--u)*3) 0 calc(var(--u)*6)}
#clear-shard{width:calc(var(--u)*40);height:calc(var(--u)*40);image-rendering:pixelated;animation:fl 1.6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(calc(var(--u)*-4))}}
#clear-stats,#end-stats{font-size:calc(var(--u)*10);line-height:1.7;color:#dfe8ff;margin:calc(var(--u)*4) 0 calc(var(--u)*8)}
#clear-stats b,#end-stats b{color:var(--gold)}
#ov-pause h2{margin:0 0 calc(var(--u)*8);font-size:calc(var(--u)*20);color:var(--gold);letter-spacing:calc(var(--u)*3)}
#ov-pause .keys{font-size:calc(var(--u)*8);color:#b8c4ff;margin-top:calc(var(--u)*6);line-height:1.6}


#ov-info{background:rgba(6,3,20,.78);z-index:10}
#ov-info .panel{max-width:calc(var(--u)*330);padding:calc(var(--u)*8) calc(var(--u)*18) calc(var(--u)*8)}
#info-kind{display:inline-block;font-size:calc(var(--u)*9);font-weight:700;color:#150c26;background:var(--gold);padding:calc(var(--u)*1) calc(var(--u)*8);border-radius:calc(var(--u)*2);letter-spacing:calc(var(--u)*1)}
#info-name{font-size:calc(var(--u)*17);font-weight:700;color:var(--gold);margin:calc(var(--u)*5) 0 calc(var(--u)*2);text-shadow:0 calc(var(--u)*2) 0 #5a2a08}
#info-ic{width:calc(var(--u)*120);height:calc(var(--u)*56);image-rendering:pixelated;background:radial-gradient(rgba(255,230,128,.18),transparent 70%)}
#info-desc{font-size:calc(var(--u)*10);line-height:1.5;color:#fff;word-break:keep-all;margin:calc(var(--u)*3) 0 calc(var(--u)*5)}

<script>
'use strict';
/* ===========================================================
   별의 기사 : 5개의 세계  —  16bit pixel action adventure
   내부 해상도 480x270 (16:9) 를 정수 픽셀 그대로 확대 표시
   =========================================================== */
const W = 480, H = 270, GY = 216;          // GY = 지면 윗면 y좌표
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sign = v => v < 0 ? -1 : v > 0 ? 1 : 0;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];

/* 시드 난수 (레벨/배경을 매번 동일하게 생성) */
function rngSeed(seed) {
  let s = seed >>> 0;
  const f = function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  f.r = (a, b) => a + f() * (b - a);
  f.i = (a, b) => Math.floor(a + f() * (b - a + 1));
  f.p = arr => arr[Math.floor(f() * arr.length)];
  return f;
}

/* ---------- 색상 유틸 (그림자는 보라/푸른 쪽, 하이라이트는 따뜻한 쪽으로) ---------- */
function hex2rgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgb2hex(r, g, b) {
  return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
}
function mix(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return rgb2hex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t));
}
const dark = (c, t = 0.3) => mix(c, '#140a2a', t);
const lite = (c, t = 0.3) => mix(c, '#fff4d0', t);

/* ---------- 입력 : 키보드 + 터치(포인터) 통합, 입력 버퍼링 ---------- */
const Input = {
  left: false, right: false, jumpHeld: false, atkHeld: false, magHeld: false,
  jumpBuf: 0, atkBuf: 0, magBuf: 0, uiPress: 0,
  keys: {}, padDirs: new Map(),
  onPause: null, onAnyKey: null,
  init() {
    const map = {
      ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
      ArrowUp: 'jump', KeyW: 'jump', KeyZ: 'jump', Space: 'jump',
      KeyX: 'atk', KeyJ: 'atk', KeyC: 'mag', KeyK: 'mag'
    };
    addEventListener('keydown', e => {
      if (e.repeat) { if (map[e.code]) e.preventDefault(); return; }
      const a = map[e.code];
      if (a) { e.preventDefault(); this.setAct(a, true); }
      if (e.code === 'KeyP' || e.code === 'Escape') this.onPause && this.onPause();
      if (e.code === 'Enter' || e.code === 'Space') this.uiPress = 6;
      this.onAnyKey && this.onAnyKey(e);
    });
    addEventListener('keyup', e => {
      const a = map[e.code];
      if (a) { e.preventDefault(); this.setAct(a, false, true); }
    });
    addEventListener('blur', () => this.releaseAll());
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.releaseAll(); });

    /* 원형 조그 다이얼: 좌우 = 이동, 위 = 점프, 대각선 위 = 이동하며 점프 */
    const stick = document.getElementById('stick'), base = document.getElementById('stick-base'), knob = document.getElementById('knob');
    let sid = null, jumpOn = false;
    const reset = () => {
      sid = null; this.padL = this.padR = false; this.syncDir(); knob.style.transform = 'translate(0px,0px)';
      stick.classList.remove('dl', 'dr', 'du'); if (jumpOn) { jumpOn = false; this.setAct('jump', false, true); }
    };
    this._stickReset = reset;
    const upd = e => {
      const rc = base.getBoundingClientRect(), R = rc.width / 2, dx = e.clientX - (rc.left + R), dy = e.clientY - (rc.top + R);
      const len = Math.hypot(dx, dy), mx = dx / R, my = dy / R, kr = Math.min(len, R * .62), an = Math.atan2(dy, dx);
      knob.style.transform = 'translate(' + (Math.cos(an) * kr).toFixed(1) + 'px,' + (Math.sin(an) * kr).toFixed(1) + 'px)';
      const l = mx < -.3, r = mx > .3;
      const wantUp = jumpOn ? (my < -.32 && len > R * .3) : (my < -.5 && len > R * .4);
      this.padL = l; this.padR = r; this.syncDir();
      if (wantUp && !jumpOn) { jumpOn = true; this.setAct('jump', true); } else if (!wantUp && jumpOn) { jumpOn = false; this.setAct('jump', false, true); }
      stick.classList.toggle('dl', l); stick.classList.toggle('dr', r); stick.classList.toggle('du', jumpOn);
    };
    stick.addEventListener('pointerdown', e => { if (sid !== null) return; e.preventDefault(); sid = e.pointerId; stick.setPointerCapture(sid); upd(e); });
    stick.addEventListener('pointermove', e => { if (e.pointerId === sid) { e.preventDefault(); upd(e); } });
    const end = e => { if (e.pointerId === sid) reset(); };
    stick.addEventListener('pointerup', end); stick.addEventListener('pointercancel', end); stick.addEventListener('lostpointercapture', end);

    const bind = (id, act) => {
      const el = document.getElementById(id);
      el.addEventListener('pointerdown', e => {
        e.preventDefault(); el.setPointerCapture(e.pointerId);
        el.classList.add('on'); this.setAct(act, true);
      });
      const up = e => { e.preventDefault(); el.classList.remove('on'); this.setAct(act, false, true); };
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
      el.addEventListener('lostpointercapture', up);
    };
    bind('b-atk', 'atk'); bind('b-mag', 'mag');
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('gesturestart', e => e.preventDefault());
  },
  setAct(a, down) {
    if (a === 'left' || a === 'right') { this.keys[a] = down; this.syncDir(); return; }
    if (a === 'jump') { this.jumpHeld = down; if (down) this.jumpBuf = 8; }
    if (a === 'atk') { this.atkHeld = down; if (down) this.atkBuf = 10; }
    if (a === 'mag') { this.magHeld = down; if (down) this.magBuf = 10; }
  },
  syncDir() {
    this.left = !!(this.keys.left || this.padL);
    this.right = !!(this.keys.right || this.padR);
  },
  tick() {
    if (this.jumpBuf > 0) this.jumpBuf--;
    if (this.atkBuf > 0) this.atkBuf--;
    if (this.magBuf > 0) this.magBuf--;
    if (this.uiPress > 0) this.uiPress--;
  },
  releaseAll() {
    this.keys = {}; this.padL = this.padR = false; this._stickReset && this._stickReset();
    this.left = this.right = this.jumpHeld = this.atkHeld = this.magHeld = false;
    this.jumpBuf = this.atkBuf = this.magBuf = 0;
    ['b-atk', 'b-mag'].forEach(i => document.getElementById(i).classList.remove('on'));
  },
  get dir() { return (this.right ? 1 : 0) - (this.left ? 1 : 0); }
};

/* ---------- 3x5 비트맵 폰트 (숫자/영문 HUD, 데미지 숫자, 배경의 거대 숫자) ---------- */
const GLYPH = {};
(function () {
  const raw = {
    '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111',
    '4': '101101111001001', '5': '111100111001111', '6': '111100111101111', '7': '111001010010010',
    '8': '111101111101111', '9': '111101111001111',
    A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110',
    E: '111100110100111', F: '111100110100100', G: '011100101101011', H: '101101111101101',
    I: '111010010010111', J: '001001001101010', K: '101101110101101', L: '100100100100111',
    M: '101111111101101', N: '110101101101101', O: '010101101101010', P: '110101110100100',
    Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010',
    U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101',
    Y: '101101010010010', Z: '111001010100111',
    '.': '000000000000010', ':': '000010000010000', '/': '001001010100100', '+': '000010111010000',
    '-': '000000111000000', '!': '010010010000010', '%': '101001010100101', 'x': '000101010101000',
    '=': '000111000111000', '?': '111001011000010', '<': '001010100010001', '>': '100010001010100',
    '*': '000101010101000', ' ': '000000000000000', '~': '000110011000000', ',': '000000000010100'
  };
  for (const k in raw) GLYPH[k] = raw[k];
})();

function textW(str, s = 1) { return str.length * 4 * s - s; }

/* 픽셀 글자 그리기. 그림자/외곽선 지원 */
function drawText(g, str, x, y, col = '#fff', s = 1, edge = null, align = 'l') {
  str = String(str).toUpperCase();
  if (align === 'c') x -= Math.floor(textW(str, s) / 2);
  else if (align === 'r') x -= textW(str, s);
  x = Math.round(x); y = Math.round(y);
  const put = (ox, oy, c) => {
    g.fillStyle = c;
    let cx = x + ox;
    for (let i = 0; i < str.length; i++) {
      const gl = GLYPH[str[i]] || GLYPH['?'];
      for (let j = 0; j < 15; j++) {
        if (gl[j] === '1') g.fillRect(cx + (j % 3) * s, y + oy + Math.floor(j / 3) * s, s, s);
      }
      cx += 4 * s;
    }
  };
  if (edge) {
    put(-s, 0, edge); put(s, 0, edge); put(0, -s, edge); put(0, s, edge);
    put(s, s, edge); put(-s, s, edge);
  }
  put(0, 0, col);
}

/* 큰 픽셀 문자를 개별 캔버스로 만들기 (배경용) */
function bigGlyph(ch, s, col) {
  const c = document.createElement('canvas'); c.width = 3 * s; c.height = 5 * s;
  const g = c.getContext('2d'); g.fillStyle = col;
  const gl = GLYPH[ch] || GLYPH['?'];
  for (let j = 0; j < 15; j++) if (gl[j] === '1') g.fillRect((j % 3) * s, Math.floor(j / 3) * s, s, s);
  return c;
}

/* ===========================================================
   픽셀 드로잉 툴킷 : 도형, 외곽선, 림 셰이딩, 디더링 그라데이션
   =========================================================== */
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);

class Px {
  constructor(w, h, cpu = false) {
    this.w = w; this.h = h;
    this.c = document.createElement('canvas');
    this.c.width = w; this.c.height = h;
    this.g = this.c.getContext('2d', cpu ? { willReadFrequently: true } : undefined);
    this.g.imageSmoothingEnabled = false;
  }
  r(x, y, w, h, col) { this.g.fillStyle = col; this.g.fillRect(Math.floor(x), Math.floor(y), w, h); return this; }
  p(x, y, col) { this.g.fillStyle = col; this.g.fillRect(Math.floor(x), Math.floor(y), 1, 1); return this; }
  clear(x, y, w, h) { this.g.clearRect(x, y, w, h); return this; }
  /* 바운딩박스 기반 타원 (x,y,w,h) */
  oval(x, y, w, h, col) {
    this.g.fillStyle = col;
    for (let j = 0; j < h; j++) {
      const dy = (j + 0.5 - h / 2) / (h / 2);
      const half = (w / 2) * Math.sqrt(Math.max(0, 1 - dy * dy));
      const x0 = Math.round(w / 2 - half), x1 = Math.round(w / 2 + half);
      if (x1 > x0) this.g.fillRect(Math.floor(x) + x0, Math.floor(y) + j, x1 - x0, 1);
    }
    return this;
  }
  circ(cx, cy, r, col) { return this.oval(cx - r, cy - r, r * 2 + 1, r * 2 + 1, col); }
  line(x0, y0, x1, y1, col, th = 1) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    this.g.fillStyle = col;
    for (let n = 0; n < 2000; n++) {
      this.g.fillRect(x0, y0, th, th);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
    return this;
  }
  /* 다각형 스캔라인 채우기 */
  poly(pts, col) {
    this.g.fillStyle = col;
    let minY = Infinity, maxY = -Infinity;
    pts.forEach(p => { minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); });
    minY = Math.floor(minY); maxY = Math.ceil(maxY);
    for (let y = minY; y < maxY; y++) {
      const yy = y + 0.5, xs = [];
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length];
        if ((a[1] <= yy && b[1] > yy) || (b[1] <= yy && a[1] > yy)) xs.push(a[0] + (yy - a[1]) / (b[1] - a[1]) * (b[0] - a[0]));
      }
      xs.sort((a, b) => a - b);
      for (let i = 0; i + 1 < xs.length; i += 2) {
        const x0 = Math.round(xs[i]), x1 = Math.round(xs[i + 1]);
        if (x1 > x0) this.g.fillRect(x0, y, x1 - x0, 1);
      }
    }
    return this;
  }
  img(c, x, y) { this.g.drawImage(c.c || c, Math.floor(x), Math.floor(y)); return this; }
  /* 림 셰이딩: 윗/왼쪽 테두리는 밝게, 아래/오른쪽 테두리는 어둡게 */
  shade(hi = 0.22, lo = 0.3) {
    const { w, h } = this, id = this.g.getImageData(0, 0, w, h), d = id.data, s = new Uint8ClampedArray(d);
    const A = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? false : s[(y * w + x) * 4 + 3] > 127;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (!A(x, y)) continue;
      const i = (y * w + x) * 4;
      const tl = !A(x, y - 1) || !A(x - 1, y), br = !A(x, y + 1) || !A(x + 1, y);
      let tr = null, k = 0;
      if (tl && !br) { tr = [255, 244, 208]; k = hi; }
      else if (br && !tl) { tr = [20, 10, 42]; k = lo; }
      if (tr) for (let c = 0; c < 3; c++) d[i + c] = d[i + c] + (tr[c] - d[i + c]) * k;
    }
    this.g.putImageData(id, 0, 0);
    return this;
  }
  /* 1px 외곽선 (캔버스에 여백 1px 필요) */
  outline(col = '#150c26', diag = false) {
    const { w, h } = this, id = this.g.getImageData(0, 0, w, h), d = id.data, s = new Uint8ClampedArray(d);
    const [R, G, B] = hex2rgb(col);
    const A = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? false : s[(y * w + x) * 4 + 3] > 127;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (A(x, y)) continue;
      if (A(x - 1, y) || A(x + 1, y) || A(x, y - 1) || A(x, y + 1) ||
        (diag && (A(x - 1, y - 1) || A(x + 1, y - 1) || A(x - 1, y + 1) || A(x + 1, y + 1)))) {
        const i = (y * w + x) * 4; d[i] = R; d[i + 1] = G; d[i + 2] = B; d[i + 3] = 255;
      }
    }
    this.g.putImageData(id, 0, 0);
    return this;
  }
  /* 셰이드 + 아웃라인 한 번에 */
  finish(oc = '#150c26', hi = 0.2, lo = 0.28) { if (hi || lo) this.shade(hi, lo); return this.outline(oc); }
  spr(ax, ay) { return new Spr(this.c, ax === undefined ? this.w / 2 : ax, ay === undefined ? this.h : ay); }
}

/* 스프라이트: 기준점(ax,ay)을 갖는 캔버스 + 좌우반전/흰색 플래시 캐시 */
class Spr {
  constructor(c, ax, ay) { this.c = c; this.w = c.width; this.h = c.height; this.ax = ax; this.ay = ay; this._f = null; this._w = null; this._wf = null; }
  get f() {
    if (!this._f) {
      const c = document.createElement('canvas'); c.width = this.w; c.height = this.h;
      const g = c.getContext('2d'); g.translate(this.w, 0); g.scale(-1, 1); g.drawImage(this.c, 0, 0); this._f = c;
    }
    return this._f;
  }
  tint(col, flip) {
    this._t = this._t || {}; const k = col + (flip ? 'f' : '');
    if (!this._t[k]) {
      const c = document.createElement('canvas'); c.width = this.w; c.height = this.h;
      const g = c.getContext('2d'); g.drawImage(flip ? this.f : this.c, 0, 0);
      g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, this.w, this.h); this._t[k] = c;
    }
    return this._t[k];
  }
  white(flip) {
    const k = flip ? '_wf' : '_w';
    if (!this[k]) {
      const c = document.createElement('canvas'); c.width = this.w; c.height = this.h;
      const g = c.getContext('2d'); g.drawImage(flip ? this.f : this.c, 0, 0);
      g.globalCompositeOperation = 'source-in'; g.fillStyle = '#fff'; g.fillRect(0, 0, this.w, this.h); this[k] = c;
    }
    return this[k];
  }
}
function drawSpr(g, s, x, y, flip = false, flash = false, alpha = 1) {
  const ax = flip ? s.w - s.ax : s.ax;
  const px = Math.round(x - ax), py = Math.round(y - s.ay);
  if (alpha < 1) g.globalAlpha = alpha;
  g.drawImage(flip ? s.f : s.c, px, py);
  if (flash) { g.globalAlpha = alpha * 0.62; g.drawImage(typeof flash === 'string' ? s.tint(flash, flip) : s.white(flip), px, py); g.globalAlpha = alpha; }
  if (alpha < 1) g.globalAlpha = 1;
}

/* 문자열 맵 → Px  (. 은 투명) */
function fromMap(rows, pal) {
  const h = rows.length, w = rows[0].length, p = new Px(w, h, true);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x];
    if (ch !== '.' && ch !== ' ' && pal[ch]) p.p(x, y, pal[ch]);
  }
  return p;
}

/* 여러 색 stops 를 보간해서 t(0..1) 색을 반환 */
function ramp(stops, t) {
  t = clamp(t, 0, 1);
  for (let i = 0; i < stops.length - 1; i++) {
    const a = stops[i], b = stops[i + 1];
    if (t <= b[0]) return mix(a[1], b[1], (t - a[0]) / Math.max(1e-6, b[0] - a[0]));
  }
  return stops[stops.length - 1][1];
}

/* 세로 디더링 그라데이션 (16비트 게임 특유의 밴딩 + 체커 전환) */
function ditherGrad(px, x, y, w, h, stops, bands = 14) {
  const id = px.g.createImageData(w, h), d = id.data;
  const pal = []; for (let i = 0; i <= bands; i++) pal.push(hex2rgb(ramp(stops, i / bands)));
  for (let j = 0; j < h; j++) {
    const v = (j / Math.max(1, h - 1)) * bands, b = Math.floor(v), fr = v - b;
    for (let i = 0; i < w; i++) {
      const thr = BAYER[((y + j) & 3) * 4 + ((x + i) & 3)];
      const c = pal[Math.min(bands, b + (fr > thr ? 1 : 0))], k = (j * w + i) * 4;
      d[k] = c[0]; d[k + 1] = c[1]; d[k + 2] = c[2]; d[k + 3] = 255;
    }
  }
  px.g.putImageData(id, x, y);
}

/* 부드러운 1차원 노이즈 (산 능선/언덕용) */
function ridge(r, w, base, amp, oct = 4, freq = 0.01) {
  const ph = [], am = [];
  for (let i = 0; i < oct; i++) { ph.push(r() * TAU); am.push(Math.pow(0.5, i)); }
  const out = [];
  for (let x = 0; x < w; x++) {
    let v = 0, tot = 0;
    for (let i = 0; i < oct; i++) { v += Math.sin(x * freq * Math.pow(2, i) + ph[i]) * am[i]; tot += am[i]; }
    out.push(base + (v / tot) * amp);
  }
  return out;
}

/* 폭신한 픽셀 구름 (임시 캔버스에 그린 뒤 합성 → 불투명 배경 위에도 안전) */
function cloudBlob(px, x, y, w, h, cols) {
  const [hi, mid, lo] = cols;
  const t = new Px(w + 8, h + 8), r = rngSeed(Math.floor(x) * 7 + Math.floor(y) * 13 + w);
  const bumps = Math.max(3, Math.round(w / 14));
  const ox = 4, oy = 4;
  t.oval(ox, oy + h * 0.45, w, h * 0.55, lo);
  const bl = [];
  for (let i = 0; i < bumps; i++) { const bw = w * r.r(0.28, 0.5), bh = h * r.r(0.55, 0.95); bl.push([bw, bh, r.r(-2, 3), r.r(-2, 3)]); }
  bl.forEach((b, i) => t.oval(ox + (w - b[0]) * (i / (bumps - 1)), oy + h * 0.55 - b[1] + b[2], b[0], b[1], lo));
  t.oval(ox + 1, oy + h * 0.4, w - 2, h * 0.5 - 2, mid);
  bl.forEach((b, i) => t.oval(ox + 1 + (w - b[0] + 2) * (i / (bumps - 1)), oy + h * 0.55 - b[1] + b[2] - 1, b[0] - 2, b[1] - 3, mid));
  for (let i = 0; i < bumps; i++) { const bw = w * 0.22, bh = h * 0.35; t.oval(ox + 4 + (w - bw - 8) * (i / (bumps - 1)), oy + h * 0.3 - (i % 2) * 3, bw, bh, hi); }
  t.g.clearRect(0, oy + h - 1, w + 8, 6);
  px.g.drawImage(t.c, Math.floor(x) - ox, Math.floor(y) - oy);
}

/* 별 뿌리기 */
function sprinkle(px, r, n, x0, y0, x1, y1, cols, big = 0.08) {
  for (let i = 0; i < n; i++) {
    const x = Math.floor(r.r(x0, x1)), y = Math.floor(r.r(y0, y1)), c = r.p(cols);
    px.p(x, y, c);
    if (r() < big) { px.p(x - 1, y, c); px.p(x + 1, y, c); px.p(x, y - 1, c); px.p(x, y + 1, c); }
  }
}

/* ===========================================================
   스프라이트 (전부 코드로 그린 픽셀아트 → 오프스크린 캔버스로 사전 생성)
   =========================================================== */
const SP = { hero: {}, en: {}, boss: {}, item: {}, fx: {}, ui: {} };

/* ---------------- 주인공 : 견습 기사 류 ---------------- */
function buildHero() {
  const C = {
    out: '#1b1030', hair: '#8b4a2b', hairL: '#bd6c3c', hairD: '#5c2f22', skin: '#f8cfa6', skinD: '#dc9c7c',
    tun: '#3daf56', tunL: '#7bd96b', tunD: '#227044', scarf: '#e5443d', scarfD: '#a3283a', scarfL: '#ff8a68',
    belt: '#6b4022', gold: '#f7cd4e', pants: '#8a6244', pantsD: '#5f4030', boot: '#96592f', bootD: '#603820', bootL: '#c08048',
    pack: '#ad6d35', packD: '#76441f', roll: '#ecd9a8', rollD: '#b59f72', blade: '#eef6fc', bladeD: '#8ea9c4', eye: '#2b1740'
  };
  const CX = 17;

  function boot(p, fx, fy, lift) {
    const y = fy - lift;
    p.r(fx - 2, y - 4, 5, 4, C.boot); p.r(fx - 2, y - 4, 5, 1, C.bootL);
    p.r(fx + 2, y - 2, 2, 2, C.boot); p.r(fx - 2, y - 1, 6, 1, C.bootD);
  }
  function leg(p, hx, hy, fx, fy, lift, front) {
    p.line(hx, hy, fx, fy - lift - 3, front ? C.pants : C.pantsD, 3);
    boot(p, fx, fy, lift);
  }
  function sword(p, hx, hy, ex, ey) {
    p.line(hx, hy, ex, ey, C.bladeD, 3);
    p.line(hx, hy, ex, ey, C.blade, 1);
    // 가드 (손 위치, 검 방향에 수직)
    const dx = ex - hx, dy = ey - hy, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
    const gx = hx + dx / L * 2, gy = hy + dy / L * 2;
    p.line(gx - nx * 3, gy - ny * 3, gx + nx * 3, gy + ny * 3, C.gold, 2);
  }

  function frame(o) {
    const p = new Px(46, 38, true), b = o.b | 0, sw = o.sw | 0;
    const pose = o.pose || 'idle';
    // ----- 다리 -----
    let nf, ff; // near/far foot {x,lift}
    if (pose === 'run') {
      const X = [5, 1, -5, -2], L = [0, 0, 0, 3], q = o.p % 4, q2 = (q + 2) % 4;
      nf = { x: CX + 2 + X[q], l: L[q] }; ff = { x: CX - 3 + X[q2], l: L[q2] };
    } else if (pose === 'jump') { nf = { x: CX + 6, l: 4 }; ff = { x: CX - 4, l: 2 }; }
    else if (pose === 'fall') { nf = { x: CX + 4, l: 1 }; ff = { x: CX - 4, l: 2 }; }
    else if (pose === 'hurt') { nf = { x: CX + 5, l: 0 }; ff = { x: CX - 5, l: 1 }; }
    else { nf = { x: CX + 3, l: 0 }; ff = { x: CX - 3, l: 0 }; }
    leg(p, CX - 2, 29 + b, ff.x, 36, ff.l, false);
    // ----- 배낭 & 침낭 -----
    p.r(CX - 10, 18 + b, 6, 9, C.pack); p.r(CX - 10, 18 + b, 6, 2, lite(C.pack, .25)); p.r(CX - 6, 19 + b, 2, 8, C.packD);
    p.oval(CX - 11, 15 + b, 9, 4, C.roll); p.r(CX - 10, 17 + b, 7, 1, C.rollD); p.p(CX - 8, 16 + b, C.rollD);
    // ----- 몸통(튜닉) -----
    p.r(CX - 5, 18 + b, 11, 9, C.tun);
    p.r(CX - 5, 18 + b, 2, 8, C.tunL); p.r(CX + 3, 19 + b, 3, 8, C.tunD);
    p.r(CX - 2, 19 + b, 1, 3, C.tunD); p.r(CX + 1, 20 + b, 1, 2, C.tunL);
    p.r(CX - 5, 25 + b, 11, 2, C.belt); p.r(CX - 1, 25 + b, 3, 2, C.gold); p.p(CX, 25 + b, C.belt);
    p.r(CX - 6, 27 + b, 13, 2, C.tun); p.r(CX - 6, 27 + b, 13, 1, C.tunL);
    [-6, -3, 0, 3, 6].forEach(x => p.p(CX + x, 29 + b, C.tunD)); p.r(CX + 4, 27 + b, 3, 2, C.tunD);
    // ----- 가까운 다리 -----
    leg(p, CX + 2, 29 + b, nf.x, 36, nf.l, true);
    // ----- 머리 -----
    const hy = 2 + b;
    p.oval(CX - 8, hy, 16, 14, C.hair);
    p.oval(CX - 4, hy + 4, 12, 10, C.skin);
    p.r(CX - 3, hy + 12, 9, 2, C.skin);
    p.r(CX + 3, hy + 6, 4, 6, C.skin);
    p.r(CX + 4, hy + 11, 3, 3, C.skinD);          // 턱 그림자
    p.r(CX - 4, hy + 4, 11, 4, C.hair);           // 앞머리
    [[-3, 8], [0, 8], [3, 8], [5, 7]].forEach(([x, y]) => p.p(CX + x, hy + y, C.hair));
    p.r(CX - 6, hy + 6, 3, 6, C.hair);              // 옆머리
    p.r(CX - 8, hy + 10, 3, 3, C.hairD);
    [[-6, 0], [-3, -1], [0, -1], [2, 0], [5, 1], [-8, 4]].forEach(([x, y]) => p.p(CX + x, hy + y, C.hair)); // 삐죽 머리
    p.r(CX - 5, hy + 1, 8, 1, C.hairL); p.r(CX - 6, hy + 2, 3, 1, C.hairL); p.r(CX - 7, hy + 6, 1, 3, C.hairD);
    p.r(CX - 2, hy + 2, 5, 1, C.hairL);
    // 눈, 볼터치
    if (pose === 'hurt') {
      p.line(CX - 1, hy + 8, CX + 1, hy + 10, C.eye); p.line(CX + 1, hy + 8, CX - 1, hy + 10, C.eye);
      p.line(CX + 3, hy + 8, CX + 5, hy + 10, C.eye); p.line(CX + 5, hy + 8, CX + 3, hy + 10, C.eye);
    } else {
      p.r(CX - 1, hy + 8, 2, 3, C.eye); p.r(CX + 3, hy + 8, 2, 3, C.eye);
      p.p(CX - 1, hy + 8, '#fff'); p.p(CX + 3, hy + 8, '#fff');
      p.p(CX, hy + 10, '#6a4aa0'); p.p(CX + 4, hy + 10, '#6a4aa0');
    }
    p.p(CX - 2, hy + 11, '#ff9a8a'); p.p(CX + 5, hy + 11, '#ff9a8a');
    p.r(CX + 2, hy + 12, 2, 1, pose === 'atk' || pose === 'hurt' ? '#8a2030' : '#c8505a');
    // ----- 목도리 -----
    p.r(CX - 5, 16 + b, 12, 3, C.scarf); p.r(CX - 5, 16 + b, 12, 1, C.scarfL); p.r(CX - 4, 18 + b, 11, 1, C.scarfD);
    const s0 = [0, 1, 0, -1][sw % 4];
    p.r(CX - 10, 17 + b + s0, 6, 3, C.scarf); p.r(CX - 10, 19 + b + s0, 6, 1, C.scarfD);
    p.r(CX - 14, 18 + b + s0 * 2, 5, 3, C.scarf); p.r(CX - 14, 20 + b + s0 * 2, 5, 1, C.scarfD); p.p(CX - 15, 19 + b + s0 * 2, C.scarfD);
    // ----- 팔 & 검 -----
    let hx, hy2, ex, ey;
    if (pose === 'atk') {
      const A = [[7, 18, 13, 3], [9, 22, 28, 22], [8, 25, 21, 34]][o.a | 0];
      [hx, hy2, ex, ey] = A;
    } else if (pose === 'up') { hx = 9; hy2 = 15; ex = 10; ey = 1; }
    else if (pose === 'cast') { hx = 9; hy2 = 22; ex = 20; ey = 19; }
    else if (pose === 'hurt') { hx = 4; hy2 = 21; ex = -1; ey = 8; }
    else if (pose === 'run') { hx = 8; hy2 = 24 + (o.p % 2); ex = 16; ey = 15 + (o.p % 2); }
    else if (pose === 'jump') { hx = 8; hy2 = 20; ex = 15; ey = 7; }
    else { hx = 8; hy2 = 24; ex = 8; ey = 9; }
    hx += CX - 0; ex += CX - 0;
    if (pose === 'hurt') { hx -= 0; }
    // 어깨-손 연결(소매)
    p.line(CX + 3, 20 + b, hx - 1, hy2 - 1, C.tunD, 3);
    p.line(CX + 3, 20 + b, hx - 1, hy2 - 1, C.tun, 1);
    sword(p, hx + 1, hy2, ex, ey);
    p.r(hx - 1, hy2 - 1, 3, 3, C.skin); p.p(hx - 1, hy2 + 1, C.skinD);
    p.p(hx + 1, hy2 + 3, C.gold);
    return p.finish(C.out, .16, .24).spr(CX, 36);
  }

  const S = SP.hero;
  S.idle = [frame({ b: 0, sw: 0 }), frame({ b: 0, sw: 1 }), frame({ b: 1, sw: 2 }), frame({ b: 1, sw: 3 })];
  S.run = [0, 1, 2, 3].map(i => frame({ pose: 'run', p: i, b: i % 2, sw: i }));
  S.jump = frame({ pose: 'jump', sw: 1 });
  S.fall = frame({ pose: 'fall', sw: 3 });
  S.atk = [0, 1, 2].map(i => frame({ pose: 'atk', a: i, sw: i }));
  S.cast = [frame({ pose: 'cast', sw: 1 }), frame({ pose: 'cast', sw: 2, b: 0 })];
  S.hurt = frame({ pose: 'hurt', sw: 2 });
  S.up = frame({ pose: 'up', sw: 1 });
}

/* ---------------- 요정 루미 (동료) ---------------- */
function buildFairy() {
  const mk = (w) => {
    const p = new Px(22, 20, true);
    const wy = w ? 3 : 6;
    p.oval(1, wy, 9, 6, 'rgba(180,240,255,0.85)'); p.oval(11, wy, 9, 6, 'rgba(180,240,255,0.85)');
    p.oval(3, wy + 1, 6, 3, 'rgba(255,255,255,0.9)'); p.oval(12, wy + 1, 6, 3, 'rgba(255,255,255,0.9)');

/* ---------------- 공격 이펙트/탄 ---------------- */
function buildFx() {
  const F = SP.fx;

  F.slash = [0, 1, 2].map(i => {
    const p = new Px(52, 52, true), g = p.g;

    g.fillStyle = '#eafcff'; p.oval(26 - R, 26 - R, R * 2, R * 2, i === 1 ? '#ffffff' : '#c9f1ff');
    g.globalCompositeOperation = 'destination-out';
    p.oval(26 - R - Math.round(R * t), 26 - R + 2, R * 2, R * 2 - 4, '#000');
    g.globalCompositeOperation = 'source-over';
    // 오른쪽 절반만 남기기

    return p.outline(dark(col, .7)).spr(c, c);
  });
  F.fire = ball('#ff5a1a', '#ffb02a', '#fff2a8');
  F.plasma = ball('#38c860', '#98f0a0', '#f0ffe8', 4);
  F.dark = ball('#7a2ad8', '#c070ff', '#f4e0ff', 5);
  F.light = ball('#ffc93a', '#fff0a0', '#ffffff', 4);
  F.bolt = ball('#28c8ff', '#a0f0ff', '#ffffff', 4);
  F.bigfire = ball('#ff3a1a', '#ff9a2a', '#fff2a8', 9);
  F.bigdark = ball('#6a1ad0', '#b060ff', '#f4e0ff', 9);

  F.arrow = (() => {
    const p = new Px(20, 7, true);
    p.r(2, 3, 14, 1, '#c9a26a'); p.poly([[16, 1], [19, 3.5], [16, 6]], '#e8f0f8'); p.r(1, 2, 3, 3, '#ffffff'); p.p(2, 3, '#ffd23a');
    return p.outline('#2a1a10').spr(10, 3);
  })();
  // 빛의 창
  F.lance = (() => {

    p.r(2, 3, 26, 3, '#fff6c0'); p.r(2, 4, 26, 1, '#ffffff'); p.poly([[28, 0], [33, 4.5], [28, 9]], '#ffd23a');
    p.r(0, 2, 3, 5, '#ffe680');

  })();
}

function glow(px, cx, cy, R, col, a0 = 0.5, steps = 7) {
  const g = px.g;

    px.circ(cx, cy, Math.round(r), col);

  const g = px.g; g.globalCompositeOperation = 'source-atop'; g.fillStyle = col;

    const t = (y - y0) / Math.max(1, y1 - y0) * maxA;
    for (let x = x0; x < x1; x++) if (BAYER[(y & 3) * 4 + (x & 3)] < t) g.fillRect(x, y, 1, 1);

function mountains(px, r, o) {

    for (const p of peaks) { const v = p.h - Math.abs(x - p.c) * p.s; if (v > best) { best = v; bc = p.c; } }
    const top = Math.round(y0 - best + Math.sin(x * 0.7) * 0.6 + (r() < 0.06 ? -1 : 0));
    const lit = x > bc;
    px.r(x, top, 1, px.h - top, lit ? cols.light : cols.body);
    if (!lit && ((x + top) & 3) === 0) px.p(x, top + 2, cols.dark);
    if (snow && best > snow) {

  const hs = ridge(r, w, y0, amp, 4, freq);

/* ---------- 행성 그리기 (디더링 셰이딩) ---------- */
function planet(px, cx, cy, R, pal, stripe = 0, seed = 1) {
  const r = rngSeed(seed);
  for (let y = -R; y <= R; y++) for (let x = -R; x <= R; x++) {
    const nx = x / R, ny = y / R, d2 = nx * nx + ny * ny;
    if (d2 > 1) continue;
    const nz = Math.sqrt(1 - d2);
    let l = Math.max(0, -0.55 * nx - 0.6 * ny + 0.62 * nz);
    if (stripe) l += Math.sin(ny * stripe + Math.sin(nx * 3) * 0.5) * 0.08;
    const v = clamp(l, 0, 0.999) * (pal.length - 1), b = Math.floor(v), fr = v - b;
    const thr = BAYER[((cy + y) & 3) * 4 + ((cx + x) & 3)];
    px.p(cx + x, cy + y, pal[Math.min(pal.length - 1, b + (fr > thr ? 1 : 0))]);
  }
}
function ringArc(px, cx, cy, rx, ry, w, cols, front) {
  for (let a = 0; a < TAU; a += 0.006) {
    const s = Math.sin(a); if ((s > 0) !== front) continue;
    for (let k = 0; k < w; k++) {
      const q = 1 + (k / w) * 0.22;
      px.p(cx + Math.cos(a) * rx * q, cy + s * ry * q + (Math.cos(a) * 0), cols[k % cols.length]);
    }
  }
}

  for (let x = 20; x < nw; ) {

/* ===========================================================

const GMARGIN = 30, GDEPTH = H - GY;          // 지면 캔버스: 위쪽 여백(장식용) + 지면 두께

function buildGround(si, len, gaps) {

    for (let x = 0; x < w; x += 2) if (r() < .5) px.p(x, M + 6 + (r() < .5 ? 1 : 0), '#2a5a2a');
    for (let i = 0; i < w / 14; i++) { const x = r.i(0, w), y = M + r.i(10, GDEPTH - 6); px.oval(x, y, r.i(4, 8), r.i(3, 5), r.p(['#b89a70', '#a08462', '#c8ac80'])); px.p(x + 1, y, '#e6d0a8'); }

    for (let x = 0; x < w; x += 4) if (r() < .35) px.r(x, M - 1 - r.i(0, 3), 1, r.i(2, 5), r.p(['#54b048', '#8ee060', '#3a9a3a']));
    for (let i = 0; i < w / 26; i++) { const x = r.i(0, w), t = r.i(0, 3); const fc = ['#ff5a6a', '#ffe24a', '#ffffff', '#6ac0ff'][t]; px.r(x, M - 6, 1, 6, '#3a9a3a'); px.r(x - 1, M - 8, 3, 3, fc); px.p(x, M - 7, '#ffd23a'); }
    for (let i = 0; i < w / 90; i++) { const x = r.i(0, w); px.oval(x, M - 8, 12, 9, '#a09a90'); px.oval(x + 1, M - 8, 6, 4, '#c8c2b8'); px.r(x + 2, M - 2, 8, 1, '#3a9a3a'); }
  } else if (si === 1) {   // 네온 격자
    px.r(0, M, w, GDEPTH, '#120c3c'); ditherGrad(px, 0, M, w, GDEPTH, [[0, '#241a72'], [1, '#0a0628']], 8);
    for (let x = 0; x < w; x += 16) px.r(x, M + 4, 1, GDEPTH, 'rgba(80,60,220,0.55)');
    for (let y = M + 4; y < h; y += 16) px.r(0, y, w, 1, 'rgba(80,60,220,0.55)');
    px.r(0, M, w, 2, '#38e0ff'); px.r(0, M + 2, w, 2, '#1a9ad0'); px.r(0, M + 4, w, 1, '#0a3a70');
    for (let x = 6; x < w; x += 48) { px.g.drawImage(bigGlyph(String(r.i(0, 9)), 2, 'rgba(56,224,255,0.45)'), x, M + 10 + r.i(0, 12)); }
    for (let x = 0; x < w; x += 16) if (r() < .3) px.r(x + 2, M + 5, 12, 1, '#ff3aa8');
    for (let x = 0; x < w; x += 40) if (r() < .5) { const d = String(r.i(0, 9)); px.g.drawImage(bigGlyph(d, 2, r.p(['#5dffa8', '#ff3aa8', '#ffe23a'])), x + r.i(0, 20), M - 12 - r.i(0, 6)); }
  } else if (si === 2) {   // 현무암 + 용암 균열
    ditherGrad(px, 0, M, w, GDEPTH, [[0, '#3a1a2a'], [.5, '#22101c'], [1, '#12060e']], 8);
    px.r(0, M, w, 3, '#7a3a44'); px.r(0, M + 3, w, 2, '#4a2030');
    for (let i = 0; i < w / 12; i++) { const x = r.i(0, w), y = M + r.i(8, GDEPTH - 4); px.oval(x, y, r.i(6, 14), r.i(4, 8), r.p(['#2c1420', '#341a28'])); }
    for (let i = 0; i < w / 26; i++) {
      let x = r.i(0, w), y = M + r.i(6, 20);
      for (let k = 0; k < 8; k++) { const nx = x + r.i(-6, 6), ny = y + r.i(3, 9); px.line(x, y, nx, ny, '#ff5a1a', 2); px.line(x, y, nx, ny, '#ffd04a', 1); x = nx; y = ny; if (y > h - 4) break; }
    }

    for (let i = 0; i < w / 60; i++) { const x = r.i(0, w); px.r(x, M - 3, 8, 3, '#d8ccb0'); px.circ(x + 2, M - 5, 3, '#f0e8d0'); px.r(x + 1, M - 6, 1, 2, '#2a0a10'); px.r(x + 3, M - 6, 1, 2, '#2a0a10'); }
    for (let x = 0; x < w; x += 6) if (r() < .3) px.r(x, M - r.i(2, 5), 1, r.i(2, 5), '#5a2a34');
  } else if (si === 3) {   // 대리석 + 금테
    ditherGrad(px, 0, M, w, GDEPTH, [[0, '#f4ecff'], [.45, '#d4c8f0'], [1, '#b8b0e4']], 8);
    for (let x = 0; x < w; x += 24) px.r(x, M + 6, 1, GDEPTH, 'rgba(120,100,180,0.4)');
    for (let y = M + 12; y < h; y += 14) for (let x = (y / 14 | 0) % 2 * 12; x < w; x += 24) px.r(x, y, 24, 1, 'rgba(120,100,180,0.4)');
    px.r(0, M, w, 3, '#ffffff'); px.r(0, M + 3, w, 3, '#f7cd4e'); px.r(0, M + 6, w, 1, '#c88a18'); for (let x = 4; x < w; x += 24) px.p(x, M + 4, '#fff8b0');
    for (let x = 0; x < w; x += 48) { px.r(x + 6, M + 12, 12, 1, '#f7cd4e'); px.p(x + 12, M + 10, '#f7cd4e'); px.p(x + 12, M + 14, '#f7cd4e'); }
    for (let i = 0; i < w / 40; i++) { const x = r.i(0, w), c = r.p(['#ffffff', '#ffc6e0', '#fff0a0']); px.r(x, M - 5, 1, 5, '#7ad870'); px.circ(x, M - 7, 2, c); px.p(x, M - 7, '#ffd23a'); }
    for (let i = 0; i < w / 70; i++) { const x = r.i(0, w); px.p(x, M - r.i(4, 12), '#fff8b0'); }
  } else {                 // 금속 갑판
    ditherGrad(px, 0, M, w, GDEPTH, [[0, '#4a5490'], [.4, '#2e3668'], [1, '#161a3c']], 8);
    for (let x = 0; x < w; x += 32) { px.r(x, M + 6, 1, GDEPTH, '#12183a'); px.r(x + 1, M + 6, 1, GDEPTH, 'rgba(138,150,200,0.35)'); for (const y of [M + 12, M + 34]) { px.p(x + 4, y, '#8a96c8'); px.p(x + 26, y, '#8a96c8'); } }
    px.r(0, M + 24, w, 1, '#12183a'); px.r(0, M + 25, w, 1, 'rgba(138,150,200,0.3)');
    px.r(0, M, w, 3, '#8a96c8'); px.r(0, M + 3, w, 2, '#38e0ff'); px.r(0, M + 5, w, 2, '#0a2a5a');

    for (let x = 0; x < w; x += 40) if (r() < .4) { px.r(x, M - 8, 3, 8, '#5a6aa0'); px.p(x + 1, M - 9, r() < .5 ? '#ff3a3a' : '#7dffb8'); }
  }

  gaps.forEach(g => {
    px.g.clearRect(g[0], 0, g[1] - g[0], h);

    px.g.clearRect(g[0] - 6, 0, 6, M - 1); px.g.clearRect(g[1], 0, 6, M - 1);
  });
  px.outline(['#1a0f0a', '#050320', '#12040a', '#5a4a90', '#0a0e26'][si]);

}

    for (let x = 6; x < w - 4; x += 11) { p.line(x, 4, x + 3, 9, '#ff5a1a', 1); p.p(x + 3, 10, '#ffd04a'); p.r(x + 2, 12, 1, 3, '#ff8a2a'); }
  } else if (si === 3) {
    const c = new Px(w + 2, h + 8, true); cloudBlob(c, 1, 2, w, 18, ['#ffffff', '#f6ecfa', '#cfc6ee']);
    p.g.drawImage(c.c, 0, 0); p.r(4, 8, w - 6, 2, '#f7cd4e'); p.r(4, 9, w - 6, 1, '#c88a18');
  } else {
    p.r(1, 0, w, 4, '#a8b4e0'); p.r(1, 0, w, 1, '#e8f0ff'); p.r(1, 4, w, 6, '#4a5490'); p.r(1, 9, w, 2, '#2a3260');
    for (let x = 5; x < w - 2; x += 10) p.r(x, 5, 5, 3, x % 20 ? '#38e0ff' : '#ff6a2a');
    p.g.globalAlpha = .7; p.poly([[w * .25, 11], [w * .75, 11], [w * .62, 20], [w * .38, 20]], '#38e0ff'); p.g.globalAlpha = 1;
  }
  return p.outline(['#1a2a10', '#050320', '#12040a', '#7a6ab0', '#0a0e26'][si]).spr(1, 0);
}

/* ---------- 가시 함정 (16x14) ---------- */
function buildSpike(si) {
  const p = new Px(20, 18, true);
  const col = [['#c6cde0', '#8890b4'], ['#ff5a8a', '#b0204a'], ['#e6dcc0', '#a89878'], ['#ffe07a', '#c8901a'], ['#7ae8ff', '#2a68d8']][si];
  [1, 7, 13].forEach(x => { p.poly([[x, 16], [x + 3, 1], [x + 6, 16]], col[1]); p.poly([[x, 16], [x + 3, 1], [x + 3, 16]], col[0]); });
  if (si === 2) [4, 10, 16].forEach(x => p.p(x, 3, '#ff8a2a'));
  return p.outline(['#1a1a2a', '#3a0a1e', '#3a1a14', '#6a4a08', '#0a1a4a'][si]).spr(10, 17);
}

/* ---------- 구덩이 채우기 (화면좌표, 애니메이션) ---------- */
function drawPit(g, si, sx, w, t) {
  const y0 = GY, hh = H - GY;
  if (w < 1) return;
  g.save(); g.beginPath(); g.rect(sx, y0, w, hh); g.clip();
  if (si === 0) {             // 강물
    const gr = g.createLinearGradient(0, y0, 0, H); gr.addColorStop(0, '#4a9aee'); gr.addColorStop(1, '#0a2a6a'); g.fillStyle = gr; g.fillRect(sx, y0, w, hh);
    for (let i = 0; i < 6; i++) { const yy = y0 + 6 + i * 8; g.fillStyle = i % 2 ? 'rgba(255,255,255,0.35)' : 'rgba(160,220,255,0.5)'; for (let x = 0; x < w; x += 8) g.fillRect(sx + x + ((t / 6 + i * 3 + x) % 8 | 0) % 8 - 4, yy + Math.round(Math.sin((x + t * 0.1) * 0.5 + i)), 5, 1); }
    g.fillStyle = 'rgba(255,255,255,0.7)'; for (let x = 0; x < w; x += 6) g.fillRect(sx + x, y0 + Math.round(Math.sin((x + t * 0.15) * 0.6) + 1), 3, 1);
  } else if (si === 1) {      // 데이터 낙하
    g.fillStyle = '#04021a'; g.fillRect(sx, y0, w, hh);
    for (let i = 0; i < w / 7; i++) { const yy = ((t * (0.6 + (i % 3) * 0.4) + i * 37) % (hh + 20)); const ch = String((i * 7 + (t / 20 | 0)) % 10); drawText(g, ch, sx + i * 7 + 1, y0 + yy - 10, '#5dffa8', 1); g.fillStyle = 'rgba(93,255,168,0.3)'; g.fillRect(sx + i * 7 + 2, y0 + yy - 22, 1, 12); }
    g.fillStyle = 'rgba(255,58,168,0.25)'; g.fillRect(sx, y0, w, 2);
  } else if (si === 2) {      // 용암
    const gr = g.createLinearGradient(0, y0, 0, H); gr.addColorStop(0, '#ffd04a'); gr.addColorStop(.25, '#ff6a1a'); gr.addColorStop(1, '#a01a1a'); g.fillStyle = gr; g.fillRect(sx, y0, w, hh);
    for (let i = 0; i < w / 5; i++) { const yy = y0 + ((i * 13 + t * (0.3 + (i % 3) * 0.2)) % hh); g.fillStyle = i % 2 ? '#ffe06a' : '#ff8a2a'; g.fillRect(sx + i * 5, yy, 3, 2); }
    for (let i = 0; i < w / 14; i++) { const ph = (t * 0.05 + i * 1.7) % 3; if (ph < 1) { g.fillStyle = '#ffee8a'; g.fillRect(sx + i * 14 + 3, y0 - ph * 10, 3, 3); } }
    g.fillStyle = 'rgba(255,240,160,0.7)'; g.fillRect(sx, y0, w, 2);
  } else if (si === 3) {      // 구름 아래 하늘
    const gr = g.createLinearGradient(0, y0, 0, H); gr.addColorStop(0, '#ffe8f8'); gr.addColorStop(1, '#7ad0ff'); g.fillStyle = gr; g.fillRect(sx, y0, w, hh);
    for (let i = 0; i < w / 18; i++) { const x = sx + ((i * 23 + t * 0.2) % (w + 20)) - 10; g.fillStyle = 'rgba(255,255,255,0.8)'; g.fillRect(x, y0 + 10 + (i * 17) % 34, 14, 3); g.fillRect(x + 3, y0 + 8 + (i * 17) % 34, 8, 3); }
    g.fillStyle = 'rgba(255,255,255,0.5)'; for (let i = 0; i < w / 9; i++) g.fillRect(sx + i * 9 + 3, y0 + ((t * 0.5 + i * 11) % hh), 1, 3);
  } else {                    // 우주 공허
    g.fillStyle = '#020108'; g.fillRect(sx, y0, w, hh);
    const r = rngSeed(5);
    for (let i = 0; i < 30; i++) { const x = r.i(0, 300), yy = r.i(0, hh); if (((t / 10 + i) | 0) % 3) { g.fillStyle = i % 4 ? '#ffffff' : '#8ad0ff'; g.fillRect(sx + (x % w), y0 + yy, 1, 1); } }
    g.fillStyle = 'rgba(122,74,232,0.3)'; g.fillRect(sx, y0 + hh - 14, w, 14);
  }
  g.restore();
  // 구덩이 위 수면 하이라이트 (가장자리 그림자)
  g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(sx, y0, 2, hh); g.fillRect(sx + w - 2, y0, 2, hh);
}

/* ---------- 절벽 벽 (등반 구간) ---------- */
function buildWall(si, w, h, A) {
  if (!A.wallBase) A.wallBase = buildGround(si, 420, []);
  const base = A.wallBase, p = new Px(w, h + GMARGIN, false), q = p.g, sx = 60, bodyY = GMARGIN + 10, bodyH = GDEPTH - 10;
  q.drawImage(base, sx, 0, w, GMARGIN + GDEPTH, 0, 0, w, GMARGIN + GDEPTH);
  let y = GMARGIN + GDEPTH; while (y < h + GMARGIN) { const hh = Math.min(bodyH, h + GMARGIN - y); q.drawImage(base, sx + 9, bodyY, w, hh, 0, y, w, hh); y += hh; }
  q.fillStyle = 'rgba(0,0,0,0.3)'; q.fillRect(w - 7, GMARGIN + 5, 7, h - 5); q.fillStyle = 'rgba(255,255,255,0.12)'; q.fillRect(0, GMARGIN + 5, 3, h - 5);
  const gr = q.createLinearGradient(0, GMARGIN + GDEPTH, 0, h + GMARGIN); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.32)'); q.fillStyle = gr; q.fillRect(0, GMARGIN + GDEPTH, w, h - GDEPTH);
  p.outline(['#1a0f0a', '#050320', '#12040a', '#5a4a90', '#0a0e26'][si]);
  return p.spr(0, GMARGIN);
}

/* ---------- 레벨 생성 ---------- */
function buildLevel(si) {
  const st = STAGES[si], r = rngSeed(7000 + si * 131), E = st.enemies;
  const L = { si, len: st.len, gaps: [], plats: [], spikes: [], spawns: [], items: [], stars: [], rests: [], walls: [], climbs: [] };
  const endX = st.len - 520;
  let x = 620, n = 0, sinceRest = 0;
  const free = (a, b) => !L.gaps.some(g => b > g[0] - 14 && a < g[1] + 14) && !L.spikes.some(s => b > s.x - 14 && a < s.x + s.w + 14) && !L.climbs.some(z => b > z[0] - 10 && a < z[1] + 10);
  const climbQ = [[.3, .62], [.28, .6], [.22, .48, .75], [.25, .52, .78], [.22, .46, .72]][si].slice();
  const enemy = (type, ex, drop) => {
    const d = EN[type], fly = d.kind === 'flyer';
    L.spawns.push({ type, x: ex, y: fly ? GY - r.i(60, 110) : GY, drop });
  };
  const stars = (sx, sy, cnt, dx = 16, arc = 0) => { for (let i = 0; i < cnt; i++) L.stars.push({ x: sx + i * dx, y: sy - Math.sin(i / Math.max(1, cnt - 1) * Math.PI) * arc }); };
  const plat = (px, py, w) => L.plats.push({ x: px, y: GY - py, w });
  const item = (type, ix, iy) => L.items.push({ type, x: ix, y: iy === undefined ? GY - 6 : iy });
  const weakOrFly = () => (r() < .6 ? E.weak : E.fly);

  while (x < endX) {
    const t = x / endX;
    let kind;
    if (n > 0 && climbQ.length && x >= endX * climbQ[0]) { kind = 'climb'; climbQ.shift(); }
    else if (n === 0) kind = 'first';
    else if (sinceRest >= 4) kind = 'rest';
    else {
      const q = r();
      if (q < .34) kind = 'fight';
      else if (q < .54) kind = 'hop';
      else if (q < .72 && t > .1) kind = 'gap';
      else if (q < .82 && (si >= 1 || t > .45) && t > .2) kind = 'spikes';
      else if (t > .22) kind = 'elite';
      else kind = 'fight';
    }
    n++; sinceRest++;
    if (kind === 'first') {
      enemy(E.weak, x + 120); stars(x + 20, GY - 26, 5, 16, 16); x += 420; sinceRest = 0;
    } else if (kind === 'rest') {
      L.rests.push([x, x + 300]); item('heart', x + 60); item('mana', x + 100); if (r() < .6) item('heart', x + 140);
      stars(x + 40, GY - 26, 6, 16, 18); x += 300; sinceRest = 0;
    } else if (kind === 'fight') {
      let cnt = 1 + (t > .35 ? 1 : 0) + (si >= 2 && r() < .5 ? 1 : 0) + (r() < .3 ? 1 : 0);
      for (let i = 0; i < cnt; i++) enemy(weakOrFly(), x + 150 + i * r.i(56, 90));
      if (t > .4 && r() < .35) enemy(E.tough, x + 150 + cnt * 84);
      if (r() < .5) stars(x + 100, GY - 30, 5, 16, 14);
      x += 300 + cnt * 66;
    } else if (kind === 'hop') {
      const np = r.i(2, 3); let px = x + 110;
      const hs = r() < .5 ? [46, 72, 96] : [88, 64, 44];
      for (let i = 0; i < np; i++) {
        const w = r.i(48, 68); plat(px, hs[i], w); stars(px + 4, GY - hs[i] - 16, 3, 16); px += w + r.i(30, 46);
      }
      if (r() < .5) item(r() < .5 ? 'mana' : 'heart', x + 120 + (np - 1) * 90, GY - hs[np - 1] - 10);
      if (si >= 1 || t > .3) enemy(weakOrFly(), x + 200);
      x += np * 110 + 180;
    } else if (kind === 'gap') {
      const gw = Math.min(90, 52 + si * 5 + r.i(0, 16)), gx = x + 170;
      if (free(gx - 20, gx + gw + 20)) {
        L.gaps.push([gx, gx + gw]);
        if (gw >= 68 || r() < .4) { plat(gx + gw / 2 - 26, 58, 52); }
        stars(gx + 6, GY - 44, 5, Math.max(12, gw / 5), 26);
        enemy(weakOrFly(), gx + gw + 130); if (t > .5) enemy(E.weak, gx - 90);
      }
      x += 170 + gw + 270;
    } else if (kind === 'spikes') {
      const cnt = r.i(2, 4), sx = x + 150;
      if (free(sx - 10, sx + cnt * 20 + 10)) {
        L.spikes.push({ x: sx, w: cnt * 20 });
        plat(sx - 6 + cnt * 10 - 24, 66, 48); stars(sx + cnt * 10 - 24, GY - 82, 4, 14);
        enemy(weakOrFly(), sx + cnt * 20 + 110);

    case 'tornado': p.r(cx - 3, cy - 3, 7, 1, c1); p.r(cx - 2, cy - 1, 5, 1, c1); p.r(cx - 1, cy + 1, 3, 1, c1); p.p(cx, cy + 3, c1); break;
    case 'ice': p.line(cx - 3, cy, cx + 3, cy, c1); p.line(cx, cy - 3, cx, cy + 3, c1); p.line(cx - 2, cy - 2, cx + 2, cy + 2, c1); p.line(cx + 2, cy - 2, cx - 2, cy + 2, c1); break;
    case 'triple': [[-3, 1], [0, -3], [3, 1]].forEach(([a, b]) => p.r(cx + a - 1, cy + b - 1, 2, 2, c1)); p.p(cx, cy + 3, c2); break;
    case 'boomerang': p.line(cx - 3, cy - 3, cx, cy + 3, c1, 2); p.line(cx, cy + 3, cx + 4, cy - 1, c1, 2); break;
    case 'meteor': p.circ(cx + 1, cy + 1, 2, c1); p.line(cx - 4, cy - 4, cx - 1, cy - 1, c2, 1); break;
    case 'homing': p.circ(cx, cy, 3, c1); p.circ(cx, cy, 1, c2); break;
    case 'laser': p.r(cx - 4, cy - 1, 9, 3, c1); p.r(cx - 4, cy, 9, 1, c2); break;
    case 'quake': p.line(cx - 4, cy + 2, cx - 2, cy - 2, c1); p.line(cx - 2, cy - 2, cx, cy + 2, c1); p.line(cx, cy + 2, cx + 2, cy - 2, c1); p.line(cx + 2, cy - 2, cx + 4, cy + 2, c1); break;
    case 'long': p.r(cx - 4, cy, 9, 1, c1); p.poly([[cx - 6, cy], [cx - 3, cy - 2], [cx - 3, cy + 2]], c1); p.poly([[cx + 6, cy], [cx + 3, cy - 2], [cx + 3, cy + 2]], c1); break;

    const col = TM_COL[k], p = new Px(24, 24, true);
    p.circ(12, 12, 11, '#7a4a08'); p.circ(12, 12, 10, '#f7cd4e'); p.circ(12, 12, 8, dark(col, .4)); p.circ(12, 12, 7, col); p.r(7, 7, 3, 2, lite(col, .6));
    if (k === 'giant') { p.poly([[12, 5], [18, 12], [14, 12], [14, 17], [10, 17], [10, 12], [6, 12]], '#fff'); }
    else if (k === 'shield') { p.poly([[7, 6], [17, 6], [17, 13], [12, 19], [7, 13]], '#fff'); p.poly([[9, 8], [15, 8], [15, 12], [12, 16], [9, 12]], col); }
    else { p.circ(12, 12, 2, '#fff'); p.poly([[10, 11], [3, 6], [5, 13], [10, 13]], '#fff'); p.poly([[14, 11], [21, 6], [19, 13], [14, 13]], '#fff'); p.circ(12, 16, 1, '#fff'); }
    p.circ(19, 5, 4, '#fff'); p.r(19, 3, 1, 3, '#150c26'); p.r(19, 5, 2, 1, '#150c26');   // 시계 표시(시간제)
    I['tm:' + k] = p.finish('#150c26', .1, .2).spr(12, 22);
  });
}

/* ---------- 획득 / 타이머 ---------- */
function pickupTimed(t) {
  const k = t.slice(3), P = G.P, col = TM_COL[k];
  if (k === 'giant') { P.giant = TM_FRAMES; Snd.sfx('grow'); G.shake = Math.max(G.shake, 6); }
  else if (k === 'shield') { P.shield = TM_FRAMES; Snd.sfx('shield'); }
  else { P.fairyT = TM_FRAMES; Snd.sfx('power'); }
  Fx.text(P.x, P.y - 40, TM_NAME[k], col, 1); Fx.ring(P.x, P.y - 16, col, 6, 44, 20); Fx.burst(P.x, P.y - 16, 22, [col, '#fff'], { spd: 3, life: 30, grav: 0 });
  G.score += 150; infoOnce(t);
}
function updateTimers(P) {
  const wg = P.giant > 0, ws = P.shield > 0, wf = P.fairyT > 0;
  if (P.giant > 0) P.giant--; if (P.shield > 0) P.shield--; if (P.fairyT > 0) P.fairyT--; if (P.shCd > 0) P.shCd--;
  const ts = P.giant > 0 ? 2 : 1; P.scale = (P.scale || 1) + (ts - (P.scale || 1)) * .18; if (Math.abs(P.scale - ts) < .01) P.scale = ts;
  if ((wg && !P.giant) || (ws && !P.shield) || (wf && !P.fairyT)) { Snd.sfx('pause'); Fx.ring(P.x, P.y - 16, '#ffffff', 6, 30, 14); Fx.text(P.x, P.y - 40, '효과 종료', '#dfe8ff', 1); }
}
function fairyShoot() {
  const P = G.P, f = G.fairy; let best = null, bd = 260;
  for (const e of G.enemies) if (!e.dead && e.x > G.cam - 10 && e.x < G.cam + W + 10) { const d = Math.hypot(e.x - f.x, (e.y - e.h / 2) - f.y); if (d < bd) { bd = d; best = [e.x, e.y - e.h / 2]; } }
  const b = G.boss; if (b && b.canHit()) { const r = b.rect(), cy = (r.t + r.b) / 2, d = Math.hypot(b.x - f.x, cy - f.y); if (d < bd) { bd = d; best = [b.x, cy]; } }
  if (!best) return;
  const a = Math.atan2(best[1] - f.y, best[0] - f.x);
  G.pb.push({ kind: 'fbolt', x: f.x, y: f.y, vx: Math.cos(a) * 4.4, vy: Math.sin(a) * 4.4, spd: 4.4, life: 70, dmg: 9 + G.stage * 2, pierce: 0, hit: new Set(), hitT: new Map(), t: 0, hw: 6, hh: 6 });
  Snd.tone(1500, .04, 'p12', .035);
}
function spawnBossTimed() {
  const k = BOSS_TM[G.stage]; dropItem('tm:' + k, G.cam + W / 2, GY - 110); Fx.text(G.cam + W / 2, GY - 130, 'TIME ITEM!', TM_COL[k], 1); Snd.sfx('heart');
}
function drawFairy() {
  const P = G.P, f = G.fairy, fs = SP.fairy[(f.t / 5 | 0) % 2];
  if (P.fairyT > 0) {
    const a = .28 + Math.sin(G.t * .2) * .1; g.globalAlpha = a; g.fillStyle = '#ffe680'; g.beginPath(); g.arc(Math.round(f.x), Math.round(f.y), 13, 0, TAU); g.fill(); g.globalAlpha = 1;
    g.save(); g.translate(Math.round(f.x), Math.round(f.y)); g.scale(1.5, 1.5); drawSpr(g, fs, 0, 0); g.restore();
    if (G.t % 5 === 0) Fx.star(f.x + rnd(-8, 8), f.y + rnd(-8, 8), '#fff6a0', 1);
  } else drawSpr(g, fs, f.x, f.y);
}
function drawShield(P) {
  if (!(P.shield > 0)) return; const sc = P.scale || 1, blink = P.shield < 180 && (P.shield / 6 | 0) % 2;
  if (blink) return; const cx = Math.round(P.x), cy = Math.round(P.y - 14 * sc), r = 19 * sc, pu = Math.sin(G.t * .15) * 1.5;
  g.globalAlpha = .2; g.fillStyle = '#5ad8ff'; g.beginPath(); g.arc(cx, cy, r + pu, 0, TAU); g.fill();
  g.globalAlpha = .9; g.strokeStyle = '#bff2ff'; g.lineWidth = 1.5; g.beginPath(); g.arc(cx, cy, r + pu, 0, TAU); g.stroke();
  g.globalAlpha = .6; g.strokeStyle = '#ffffff'; g.beginPath(); g.arc(cx, cy, r + pu - 3, -2.4, -1.2); g.stroke(); g.globalAlpha = 1;
}
function drawTimedHUD() {
  const P = G.P; let i = 0;
  for (const [k, v] of [['giant', P.giant], ['shield', P.shield], ['fairy', P.fairyT]]) {
    if (!(v > 0)) continue; const y = 62 + i * 13, col = TM_COL[k];
    g.fillStyle = 'rgba(14,10,36,0.85)'; g.fillRect(4, y, 92, 12); g.fillStyle = '#c8a86a'; g.fillRect(4, y, 92, 1); g.fillRect(4, y + 11, 92, 1);
    iconAt(SP.item['tm:' + k], 6, y + 1, 10);
    g.fillStyle = '#150c26'; g.fillRect(20, y + 3, 52, 6); g.fillStyle = (v < 180 && (G.t / 6 | 0) % 2) ? '#ffffff' : col; g.fillRect(21, y + 4, Math.round(50 * v / TM_FRAMES), 4);
    drawText(g, Math.ceil(v / 60) + 'S', 92, y + 3, '#fff', 1, '#0e0a24', 'r'); i++;
  }
}

/* ---------- 블랙홀 폭탄 ---------- */
const BOMB_CHARGE = 30, BOMB_SUCK = 50, BOMB_DET = BOMB_CHARGE + BOMB_SUCK, BOMB_END = BOMB_DET + 36;
function startBomb() {
  const P = G.P; G.arms.bombs--; G.bombT = 1; P.needRel = true; P.holdT = 0; P.inv = Math.max(P.inv, BOMB_END + 30); P.atkT = 0; P.castT = 0; P.vx = 0;
  G.bombBeams = []; G.bombVort = { x: G.cam + W / 2, y: GY - 92, open: 0, t: 0 }; G.bombPulled = []; G.bombBurst = 0; G.bombZoom = 1;
  Snd.sfx('bombcharge'); Input.atkBuf = 0;
}
function bombStep() {
  const P = G.P, t = ++G.bombT, sc = P.scale || 1, v = G.bombVort, tx = P.x + P.face * 10 * sc, ty = P.y - 36 * sc, ease = k => k * k * (3 - 2 * k);
  if (t <= BOMB_CHARGE) {
    G.bombZoom = 1 + .12 * ease(t / BOMB_CHARGE);
    for (let i = 0; i < 2; i++) { const a = rnd(0, TAU), r = rnd(40, 90); Fx.add({ x: tx + Math.cos(a) * r, y: ty + Math.sin(a) * r, vx: -Math.cos(a) * r / 14, vy: -Math.sin(a) * r / 14, life: 14, max: 14, grav: 0, col: pick(['#fff6a0', '#ffffff', '#ffb05a']), s: 2, k: 0 }); }
    if (t % 8 === 0) Snd.sfx('gauge'); if (t > 12) G.shake = Math.max(G.shake, 1.5);
  }
  if (t === BOMB_CHARGE) {
    Snd.sfx('vortex'); G.flash = 8; G.flashCol = '#ffe0a0';
    for (const e of G.enemies) if (!e.dead && e.x > G.cam - 10 && e.x < G.cam + W + 10) { G.bombPulled.push({ e, ox: e.x, oy: e.y }); e.bs = 1; e.spin = 0; }
  }
  if (t > BOMB_CHARGE && t <= BOMB_DET) {
    const k = (t - BOMB_CHARGE) / BOMB_SUCK, ke = ease(k); v.open = Math.min(1, k * 2.5); v.t++; G.bombZoom = 1.12 + .03 * k;
    for (const p of G.bombPulled) { const e = p.e; if (e.dead) continue; e.x = p.ox + (v.x - p.ox) * ke * ke; e.y = p.oy + ((v.y + e.h / 2) - p.oy) * ke * ke; e.bs = Math.max(.08, 1 - .92 * ke * ke); e.spin = (e.spin || 0) + .1 + ke * .7; }
    for (let i = G.eb.length - 1; i >= 0; i--) { const q = G.eb[i]; q.x += (v.x - q.x) * .1; q.y += (v.y - q.y) * .1; if (Math.hypot(q.x - v.x, q.y - v.y) < 14) G.eb.splice(i, 1); }
    for (let i = 0; i < 3; i++) { const a = rnd(0, TAU), r = rnd(120, 270); Fx.add({ x: v.x + Math.cos(a) * r, y: v.y + Math.sin(a) * r * .7, vx: -Math.cos(a) * r / 15, vy: -Math.sin(a) * r * .7 / 15, life: 15, max: 15, grav: 0, col: pick(['#ffd080', '#ff9a3a', '#ffffff', '#c090ff']), s: 2, k: 0 }); }
    G.shake = Math.max(G.shake, 2 + k * 5);
  }
  if (t === BOMB_DET) {
    G.flash = 28; G.flashCol = '#ffffff'; G.shake = 20; Snd.sfx('bomb'); G.bombBurst = 1;
    for (const p of G.bombPulled) { const e = p.e; if (e.dead) continue; G.bombBeams.push({ x: p.ox, y: p.oy, t: 0 }); hurtEnemy(e, 100, sign(p.ox - v.x) || 1, true); }
    for (const p of G.bombPulled) { const e = p.e; if (!e.dead) { e.x = p.ox; e.y = p.oy; e.stun = Math.max(e.stun || 0, 40); } e.bs = undefined; e.spin = 0; }
    const b = G.boss; if (b && b.canHit()) { G.bombBeams.push({ x: b.x, y: b.y, t: 0 }); b.hurt(Math.max(60, Math.round(b.maxhp * .1)), sign(b.x - v.x) || 1); }
    for (const q of G.eb) Fx.burst(q.x, q.y, 4, ['#fff', '#ffe680'], { life: 14 }); G.eb.length = 0;
    Fx.ring(v.x, v.y, '#ffffff', 10, 320, 30); Fx.ring(v.x, v.y, '#ffb05a', 6, 240, 26); Fx.ring(v.x, v.y, '#c090ff', 4, 170, 22);
    Fx.burst(v.x, v.y, 60, ['#fff', '#ffe680', '#ff9a3a', '#c090ff'], { spd: 6, life: 34, grav: 0, size: 3 });
    for (let i = 0; i < 50; i++) Fx.star(G.cam + rnd(0, W), rnd(10, GY), pick(['#fff6a0', '#ffffff', '#ffb05a', '#bfe9ff']), 1);
  }
  if (t > BOMB_DET) { G.bombBurst++; v.open = Math.max(0, 1 - (t - BOMB_DET) / 10); G.bombZoom = Math.max(1, 1.15 - (t - BOMB_DET) * .02); }
  if (t > BOMB_END) { G.bombT = 0; G.bombVort = null; G.bombBeams = []; G.bombZoom = 1; G.bombPulled = []; }
  for (const bb of G.bombBeams) bb.t++;
}
function drawBombDim(camX) {
  if (G.bombT <= 0) return; const t = G.bombT;
  const a = t <= BOMB_CHARGE ? .5 * t / BOMB_CHARGE : t <= BOMB_DET ? .5 + .18 * (t - BOMB_CHARGE) / BOMB_SUCK : Math.max(0, .68 * (1 - (t - BOMB_DET) / 30));
  g.fillStyle = 'rgba(8,2,26,' + a + ')'; g.fillRect(camX - 30, -30, W + 60, H + 60);
}
function drawBombVortex(g) {
  const v = G.bombVort; if (!v || v.open <= .02) return;
  const o = v.open, cx = v.x, cy = v.y, t = G.bombT, rx = 72 * o, ry = 94 * o;
  g.save();
  g.fillStyle = '#ff9a3a'; g.globalAlpha = .15; g.beginPath(); g.ellipse(cx, cy, rx * 1.9, ry * 1.5, 0, 0, TAU); g.fill();
  g.globalAlpha = .28; g.beginPath(); g.ellipse(cx, cy, rx * 1.4, ry * 1.22, 0, 0, TAU); g.fill(); g.globalAlpha = 1;
  g.fillStyle = '#07020f'; g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, TAU); g.fill();
  g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, TAU); g.clip();
  const cols = ['#ffd080', '#ff5a1a', '#ffffff', '#7a3ab0'];
  for (let arm = 0; arm < 6; arm++) for (let s = 3; s < 100; s++) { const q = s / 100, an = t * .22 + arm * TAU / 6 + s * .085 * (1.4 - q * .5); g.fillStyle = cols[(arm + (s >> 4)) % 4]; const z = q > .55 ? 3 : 2; g.fillRect(Math.round(cx + Math.cos(an) * rx * q), Math.round(cy + Math.sin(an) * ry * q), z, z); }
  g.fillStyle = '#000'; g.beginPath(); g.ellipse(cx, cy, rx * .28, ry * .28, 0, 0, TAU); g.fill();
  g.restore();
  for (let a = 0; a < TAU; a += .035) { g.fillStyle = (Math.floor(a * 18) + (t >> 1)) % 3 ? '#ffb05a' : '#ffffff'; g.fillRect(Math.round(cx + Math.cos(a) * (rx + 1)), Math.round(cy + Math.sin(a) * (ry + 1)), 3, 3); }
}
function drawArmsFx(g) {
  for (const bm of G.beams) {
    const x0 = Math.min(bm.x0, bm.x1), w = Math.abs(bm.x1 - bm.x0), th = bm.t < 4 ? bm.t * 4 : (bm.t > 12 ? (16 - bm.t) * 4 : 16), y = Math.round(bm.y);
    g.fillStyle = 'rgba(56,224,255,0.45)'; g.fillRect(x0, y - th / 2 - 3, w, th + 6); g.fillStyle = '#bdf6ff'; g.fillRect(x0, y - th / 2, w, th); g.fillStyle = '#ffffff'; g.fillRect(x0, y - th / 4, w, Math.max(1, th / 2));
  }
  for (const z of G.zaps) {
    const [ax, ay] = z.a, [bx, by] = z.b, n = 6; let px = ax, py = ay; const r = rngSeed(z.t * 13 + Math.floor(ax));
    for (let i = 1; i <= n; i++) { const nx = lerp(ax, bx, i / n) + (i < n ? r.r(-7, 7) : 0), ny = lerp(ay, by, i / n) + (i < n ? r.r(-7, 7) : 0); g.strokeStyle = '#ffe23a'; g.lineWidth = 3; g.beginPath(); g.moveTo(px, py); g.lineTo(nx, ny); g.stroke(); g.strokeStyle = '#fff'; g.lineWidth = 1; g.beginPath(); g.moveTo(px, py); g.lineTo(nx, ny); g.stroke(); px = nx; py = ny; }
  }
  const P = G.P, v = G.bombVort, t = G.bombT;
  if (t > 0 && t <= BOMB_CHARGE) {
    const sc = P.scale || 1, tx = P.x + P.face * 10 * sc, ty = P.y - 36 * sc, r = 2 + t * .55;
    g.globalAlpha = .28; g.fillStyle = '#fff6a0'; for (let i = 0; i < 9; i++) { const a = i * TAU / 9 + t * .16, L = 20 + t * 4, w = .07; g.beginPath(); g.moveTo(tx, ty); g.lineTo(tx + Math.cos(a - w) * L, ty + Math.sin(a - w) * L); g.lineTo(tx + Math.cos(a + w) * L, ty + Math.sin(a + w) * L); g.fill(); }
    g.globalAlpha = .5; g.beginPath(); g.arc(tx, ty, r + 3, 0, TAU); g.fill(); g.globalAlpha = 1; g.fillStyle = '#fff'; g.beginPath(); g.arc(tx, ty, r, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(255,240,160,0.6)'; g.lineWidth = 1; const rr = 60 * (1 - t / BOMB_CHARGE) + 12; g.beginPath(); g.arc(P.x, P.y - 16 * sc, rr, 0, TAU); g.stroke();
  }
  if (v) drawBombVortex(g);
  if (v && G.bombBurst > 0 && G.bombBurst <= 26) {
    const kb = G.bombBurst; g.fillStyle = '#ffffff'; g.globalAlpha = (1 - kb / 26) * .6;
    for (let i = 0; i < 14; i++) { const a0 = i * TAU / 14 + kb * .035; g.beginPath(); g.moveTo(v.x, v.y); g.lineTo(v.x + Math.cos(a0) * 460, v.y + Math.sin(a0) * 460); g.lineTo(v.x + Math.cos(a0 + .11) * 460, v.y + Math.sin(a0 + .11) * 460); g.fill(); }
    g.globalAlpha = 1;
  }
  for (const bb of G.bombBeams) { const w = Math.max(0, 16 - bb.t * 1.3), a = Math.max(0, 1 - bb.t / 14); g.globalAlpha = a; g.fillStyle = '#fff'; g.fillRect(Math.round(bb.x - w / 2), 0, Math.round(w), Math.round(bb.y)); g.fillStyle = '#ffe680'; g.fillRect(Math.round(bb.x - w / 4), 0, Math.round(w / 2), Math.round(bb.y)); g.globalAlpha = 1; }
}
function drawBombText() {
  const kb = G.bombBurst; if (!(kb > 0 && kb <= 30)) return;
  g.globalAlpha = Math.min(1, (30 - kb) / 12); const s = kb < 5 ? 3 + kb : 8;
  drawText(g, 'BOMB!', W / 2, 40, kb % 4 < 2 ? '#fff6a0' : '#ffffff', s, '#7a2a08', 'c'); g.globalAlpha = 1;
}
